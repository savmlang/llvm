name: Build LLVM 22.1 Static

on:
  push:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  linux:
    name: Build LLVM (${{ matrix.triple }})

    strategy:
      matrix:
        include:
          # Arm64
          - arch: AArch64
            install: clang libc6-dev-arm64-cross
            triple: aarch64-linux-gnu

          # x86_64 (x64)
          - arch: X86
            install: clang
            triple: x86_64-linux-gnu

          # i686 (x86 32-bit)
          - arch: X86
            install: clang gcc-multilib g++-multilib
            triple: i686-linux-gnu
            flags: -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32"

          # LoongArch64 (GCC 13)
          - arch: LoongArch
            install: clang libc6-dev-loong64-cross
            triple: loongarch64-linux-gnu

          # ARMv7 (HF)
          - arch: ARM
            install: clang libc6-dev-armel-cross
            triple: arm-linux-gnueabihf

          # MacOS
          - arch: AArch64
            os: macos-26
            triple: arm64-apple-darwin

          - arch: X86
            os: macos-26-intel
            triple: x86_64-apple-darwin


    runs-on: ${{ matrix.os || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout LLVM
        uses: actions/checkout@v6
        with:
          repository: llvm/llvm-project
          path: llvm
          fetch-depth: 1
          ref: llvmorg-22.1.3

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y lld ${{ matrix.install }}

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          echo "PATH=$(brew --prefix ccache)/libexec:$PATH" >> $GITHUB_PATH

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            llvm/build
            ~/.ccache
          key: ${{ runner.os }}-llvm-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-llvm-

      - name: Build LLVM
        working-directory: llvm
        run: |
          export CC=clang
          export CXX=clang++

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            SYSTEM_NAME="Darwin"
          else
            SYSTEM_NAME="Linux"
          fi

          [[ "${{ runner.os }}" == "macOS" ]] && LINKER_SETTING="" || LINKER_SETTING="-DLLVM_USE_LINKER=lld"

          # LLVM Host
          cmake -G Ninja -S llvm -B build_native \
            -DLLVM_TARGETS_TO_BUILD="Native" \
            -DCMAKE_BUILD_TYPE=Release $LINKER_SETTING
          ninja -C build_native llvm-tblgen

          rm -rf .git
          cp $(pwd)/build_native/bin/llvm-tblgen $(pwd)/native-llvm-tblgen
          rm -rf build_native

          # Cross Build
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=$SYSTEM_NAME \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_TABLEGEN=$(pwd)/native-llvm-tblgen \
            -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.triple }} \
            -DLLVM_TARGETS_TO_BUILD="${{ matrix.arch }}" \
            -DLLVM_BUILD_STATIC=ON \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_PLUGINS=OFF $LINKER_SETTING \
            ${{ matrix.flags }}

          ninja -C build
          rm -rf ./build/bin/

      - name: Tar
        run: |
          tar -czvf llvm-static-${{ matrix.triple }}.tar.gz \
            -C llvm/build lib include

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: llvm-static-${{ matrix.triple }}
          path: llvm-static-${{ matrix.triple }}.tar.gz
          archive: false