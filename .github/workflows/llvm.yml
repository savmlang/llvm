name: Build LLVM 22.1 Static

on:
  push:
    paths:
      - .github/workflows/llvm.yml
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: 

permissions:
  contents: write

env:
  llvmversion: llvmorg-22.1.3

jobs:
  windows:
    name: Build LLVM (${{ matrix.triple }})

    # Ironically, windows 11 Arm runs and builds times faster than windows-latest
    runs-on: windows-11-arm

    strategy:
      matrix:
        include:
          - arch: AArch64
            triple: aarch64-pc-windows-msvc
            vsmode: arm64

          - arch: X86
            triple: x86_64-pc-windows-msvc
            vsmode: arm64_x64

          - arch: X86
            triple: i686-pc-windows-msvc
            vsmode: arm64_x86

    steps:
      - name: Git Large Path
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout LLVM
        uses: actions/checkout@v6
        with:
          repository: llvm/llvm-project
          path: llvm
          fetch-depth: 1
          ref: ${{ env.llvmversion }}

      - name: Install Ninja
        uses: llvm/actions/install-ninja@89a8cf80982d830faab019237860b344a6390c30

      - name: Build LLVM
        working-directory: llvm
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do (
            set "VS_PATH=%%i"
          )

          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vsmode }}
          
          :: Build
          cmake -G Ninja -S llvm -B build ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.triple }} ^
            -DLLVM_TARGETS_TO_BUILD="${{ matrix.arch }}" ^
            -DLLVM_BUILD_TOOLS=OFF ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_ENABLE_PLUGINS=OFF ^
            -DCMAKE_INSTALL_PREFIX=install

          ninja -C build install
          powershell rm -Force -Recurse ./install/bin/

      - name: Tar
        run: |
          tar -czvf llvm-static-${{ matrix.triple }}.tar.gz `
            -C llvm/install lib include

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: llvm-static-${{ matrix.triple }}
          path: llvm-static-${{ matrix.triple }}.tar.gz
          archive: false


  macos:
    name: Build LLVM (${{ matrix.triple }})

    strategy:
      matrix:
        include:
          # MacOS
          - arch: AArch64
            os: macos-26
            triple: arm64-apple-darwin

          - arch: X86
            os: macos-26-intel
            triple: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout LLVM
        uses: actions/checkout@v6
        with:
          repository: llvm/llvm-project
          path: llvm
          fetch-depth: 1
          ref: ${{ env.llvmversion }}

      - name: Build LLVM
        working-directory: llvm
        run: |
          # Build
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.triple }} \
            -DLLVM_TARGETS_TO_BUILD="${{ matrix.arch }}" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DCMAKE_INSTALL_PREFIX=install

          ninja -C build install
          rm -rf ./install/bin/

      - name: Tar
        run: |
          tar -czvf llvm-static-${{ matrix.triple }}.tar.gz \
            -C llvm/install lib include

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: llvm-static-${{ matrix.triple }}
          path: llvm-static-${{ matrix.triple }}.tar.gz
          archive: false


  linux:
    name: Build LLVM (${{ matrix.triple }})

    strategy:
      matrix:
        include:
          # Arm64
          - arch: AArch64
            install: clang libc6-dev-arm64-cross
            triple: aarch64-linux-gnu

          # x86_64 (x64)
          - arch: X86
            install: clang
            triple: x86_64-linux-gnu

          # i686 (x86 32-bit)
          - arch: X86
            install: clang gcc-multilib g++-multilib
            triple: i686-linux-gnu
            flags: -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32"

          # LoongArch64 (GCC 13)
          - arch: LoongArch
            install: clang libc6-dev-loong64-cross
            triple: loongarch64-linux-gnu

          # ARMv7 (HF)
          - arch: ARM
            install: clang libc6-dev-armel-cross
            triple: arm-linux-gnueabihf            


    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout LLVM
        uses: actions/checkout@v6
        with:
          repository: llvm/llvm-project
          path: llvm
          fetch-depth: 1
          ref: ${{ env.llvmversion }}

      - name: Install Dependencies
        run: |
          sudo apt-get install -y lld ${{ matrix.install }}

      - name: Build LLVM
        working-directory: llvm
        run: |
          export CC=clang
          export CXX=clang++

          # LLVM Host
          cmake -G Ninja -S llvm -B build_native \
            -DLLVM_TARGETS_TO_BUILD="Native" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_USE_LINKER=lld
          ninja -C build_native llvm-tblgen

          rm -rf .git
          cp $(pwd)/build_native/bin/llvm-tblgen $(pwd)/native-llvm-tblgen
          rm -rf build_native

          # Cross Build
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_TABLEGEN=$(pwd)/native-llvm-tblgen \
            -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.triple }} \
            -DLLVM_TARGETS_TO_BUILD="${{ matrix.arch }}" \
            -DLLVM_BUILD_STATIC=ON \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DCMAKE_INSTALL_PREFIX=install \
            -DLLVM_USE_LINKER=lld ${{ matrix.flags }}

          ninja -C build install
          rm -rf ./install/bin/

      - name: Tar
        run: |
          tar -czvf llvm-static-${{ matrix.triple }}.tar.gz \
            -C llvm/install lib include

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: llvm-static-${{ matrix.triple }}
          path: llvm-static-${{ matrix.triple }}.tar.gz
          archive: false

  release-llvm:
    name: Release LLVM

    runs-on: ubuntu-latest

    needs: [windows, macos, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Generate timestamp
        id: time
        run: echo "time=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT

      - name: Release Artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.llvmversion }}-${{ steps.time.outputs.time }}
          body: |
            # LLVM Build (${{ env.llvmversion }})
            Uploaded at : ${{ steps.time.outputs.time }}

            This is an autogenerated build of LLVM meant for static compilation of LLVM to be used
            in SaVM Projects.
          files: release/**/*.tar.gz