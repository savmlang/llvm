name: Build LLVM 22.1 Static

on:
  push: 
  schedule:
    - cron: '0 0 1 * *'

jobs:
  linux:
    name: Build LLVM (linux-${{ matrix.arch }})

    strategy:
      matrix:
        include:
          # Arm64
          - arch: AArch64
            install: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            gcc: aarch64-linux-gnu-gcc
            gpp: aarch64-linux-gnu-g++
            triple: aarch64-linux-gnu

          # x86_64 (x64)
          - arch: X86
            install: gcc g++
            gcc: gcc
            gpp: g++
            triple: x86_64-linux-gnu

          # i686 (x86 32-bit)
          - arch: X86
            install: gcc-multilib g++-multilib
            gcc: gcc
            gpp: g++
            triple: i686-linux-gnu

          # LoongArch64
          - arch: LoongArch
            install: gcc-loongarch64-linux-gnu g++-loongarch64-linux-gnu
            gcc: loongarch64-linux-gnu-gcc
            gpp: loongarch64-linux-gnu-g++
            triple: loongarch64-linux-gnu

          # ARMv7 (Hard Float)
          - arch: ARM
            install: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            gcc: arm-linux-gnueabihf-gcc
            gpp: arm-linux-gnueabihf-g++
            triple: arm-linux-gnueabihf


    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout LLVM
        uses: actions/checkout@v6
        with:
          repository: llvm/llvm-project
          path: llvm
          fetch-depth: 1
          ref: llvmorg-22.1.3

      - name: Install Dependencies
        run: |
          if [[ "${{ matrix.arch }}" == "LoongArch" ]]; then
            sudo add-apt-repository ppa:loongarch-dev/toolchain -y
            sudo apt-get update
          fi
          
          sudo apt-get install -y ${{ matrix.install }}

      - name: Build LLVM
        working-directory: llvm
        run: |
          # LLVM Host
          cmake -G Ninja -S llvm -B build_native \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C build_native llvm-tblgen

          rm -rf .git
          cp $(pwd)/build_native/bin/llvm-tblgen $(pwd)/native-llvm-tblgen
          rm -rf build_native

          # Cross Build
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_COMPILER=${{ matrix.gcc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.gpp }} \
            -DLLVM_TABLEGEN=$(pwd)/native-llvm-tblgen \
            -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.triple }} \
            -DLLVM_TARGETS_TO_BUILD="${{ matrix.arch }}" \
            -DLLVM_BUILD_STATIC=ON \
            -DLLVM_BUILD_TOOLS=OFF
          ninja -C build